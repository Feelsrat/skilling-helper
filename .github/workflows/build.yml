name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build shadowJar -Pversion="$VERSION"

      - name: Build Android launcher (SkillingHelper.exe)
        run: |
          command -v lld-link >/dev/null && command -v llvm-dlltool >/dev/null || sudo apt-get install -y -q clang lld llvm
          android/launcher/build.sh build/libs/SkillingHelper.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skilling-helper-${{ env.VERSION }}
          path: |
            build/libs/*.jar
            build/libs/SkillingHelper.exe

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed names the Android launcher downloads from releases/latest/download/
          cp "build/libs/skilling-helper-$VERSION-all.jar" build/android-client.jar
          echo "v$VERSION" > build/android-version.txt
          gh release create "v$VERSION" \
            build/libs/skilling-helper-$VERSION.jar \
            build/libs/skilling-helper-$VERSION-all.jar \
            steamdeck/skilling-helper-update.sh \
            android/skilling-helper-android.sh \
            build/libs/SkillingHelper.exe \
            build/android-client.jar \
            build/android-version.txt \
            --target "$GITHUB_SHA" \
            --title "Skilling Helper v$VERSION" \
            --generate-notes \
            --notes "Built from ${GITHUB_SHA::7}.

          - \`skilling-helper-$VERSION.jar\`: Skilling Helper and PvM Progression on their own, for sideloading into RuneLite.
          - \`skilling-helper-$VERSION-all.jar\`: standalone dev client with both plugins bundled (\`java -jar skilling-helper-$VERSION-all.jar\`).
          - \`skilling-helper-update.sh\`: Steam Deck updater. It finds your RuneLite Steam shortcut and swaps in the newest jar (see the README).
          - \`skilling-helper-android.sh\`: Android installer/updater, run in Termux. Sets up the GameNative game (see the README).
          - \`SkillingHelper.exe\`, \`android-client.jar\`, \`android-version.txt\`: used by the Android game; its launcher updates itself to the newest client on every start."
